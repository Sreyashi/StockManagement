<!DOCTYPE html>
<html lang="en" data-skin="studio">
<head>
<meta charset="UTF-8">
<title>Fresh Inventory Transfer Agent</title>
<style>
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-0: 13px;
  --fs-1: 14px;
  --fs-2: 16px;
  --fs-3: 20px;
  --fs-4: 28px;
  --lh: 1.5;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 10px;
  --ok: #1FA971;
  --warn: #D98E04;
  --danger: #D64545;
  --info: #3B82F6;
}

[data-skin="studio"] {
  --bg: #F6F7FB;
  --bg-raise: #FFFFFF;
  --bg-inset: #EEF0F6;
  --line: #E1E5EF;
  --ink: #131A2A;
  --ink-2: #4C5670;
  --ink-3: #8B93A9;
  --accent: #4056C9;
  --accent-ink: #FFFFFF;
  --chip: #EDF0FA;
  --shadow: 0 1px 2px rgba(19,26,42,.06), 0 12px 28px -14px rgba(19,26,42,.18);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-1);
  line-height: var(--lh);
}

.header {
  background: var(--bg-raise);
  border-bottom: 1px solid var(--line);
  padding: var(--sp-4) var(--sp-5);
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  box-shadow: var(--shadow);
}

.header .title {
  font-size: var(--fs-3);
  font-weight: 700;
}

.header .api-section {
  margin-left: auto;
  display: flex;
  gap: var(--sp-2);
  align-items: center;
}

.header input {
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: var(--fs-1);
}

.header button {
  padding: 8px 16px;
  background: var(--accent);
  color: var(--accent-ink);
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: var(--sp-5);
}

.case-selector {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-6);
}

.case-btn {
  padding: var(--sp-3);
  background: var(--bg-raise);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  font-size: var(--fs-2);
  transition: all 0.2s;
}

.case-btn:hover {
  border-color: var(--accent);
}

.case-btn.active {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}

.workflow-container {
  display: none;
}

.workflow-container.active {
  display: block;
}

.stage-block {
  background: var(--bg-raise);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--sp-4);
  margin-bottom: var(--sp-4);
  position: relative;
}

.stage-header {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
  padding-bottom: var(--sp-3);
  border-bottom: 2px solid var(--line);
}

.stage-number {
  width: 40px;
  height: 40px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: var(--fs-2);
}

.stage-title {
  font-size: var(--fs-3);
  font-weight: 700;
}

.stage-description {
  color: var(--ink-2);
  font-size: var(--fs-0);
  margin-top: var(--sp-2);
  line-height: 1.6;
}

.stage-content {
  margin-top: var(--sp-3);
}

.card {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--sp-3);
  margin-top: var(--sp-2);
}

.card-label {
  font-size: var(--fs-0);
  color: var(--ink-3);
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: var(--sp-1);
}

.card-value {
  font-size: var(--fs-2);
  color: var(--ink);
  font-weight: 600;
}

.card-subtext {
  font-size: var(--fs-0);
  color: var(--ink-2);
  margin-top: var(--sp-1);
}

.loading {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-2);
  color: var(--info);
  font-weight: 600;
}

.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--info);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: var(--fs-0);
  font-weight: 700;
}

.status-badge.ok {
  background: color-mix(in srgb, var(--ok) 14%, transparent);
  color: var(--ok);
}

.status-badge.danger {
  background: color-mix(in srgb, var(--danger) 14%, transparent);
  color: var(--danger);
}

.action-buttons {
  display: flex;
  gap: var(--sp-2);
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
}

.btn-approve {
  flex: 1;
  padding: 12px;
  background: var(--ok);
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  font-size: var(--fs-1);
}

.btn-escalate {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: 2px solid var(--danger);
  color: var(--danger);
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  font-size: var(--fs-1);
}

.btn-approve:disabled, .btn-escalate:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.explanation-text {
  color: var(--ink-2);
  font-size: var(--fs-0);
  line-height: 1.6;
  margin: var(--sp-2) 0;
}

.decision-box {
  background: color-mix(in srgb, var(--info) 8%, transparent);
  border-left: 4px solid var(--info);
  padding: var(--sp-3);
  margin-top: var(--sp-3);
  border-radius: 4px;
}

.field-row {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: var(--sp-3);
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--line);
}

.field-row:last-child {
  border-bottom: none;
}

.field-label {
  font-weight: 700;
  color: var(--ink-3);
  font-size: var(--fs-0);
}

.field-value {
  color: var(--ink);
}

.evals-section {
  margin-top: var(--sp-6);
  background: var(--bg-raise);
  padding: var(--sp-4);
  border-radius: var(--radius);
}

.footer-text {
  color: var(--ink-3);
  font-size: var(--fs-0);
  margin-top: var(--sp-4);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--line);
}
</style>
</head>
<body>

<div class="header">
  <div class="title">Fresh Inventory Transfer Agent</div>
  <div class="api-section">
    <input type="password" id="api-key" placeholder="Paste your Anthropic API key">
    <button onclick="saveKey()">Save Key</button>
  </div>
</div>

<div class="container">
  <div class="case-selector" id="case-selector"></div>
  <div class="workflow-container" id="workflow"></div>
</div>

<script>
const MODEL = "claude-sonnet-4-5";
const API_URL = "https://api.anthropic.com/v1/messages";
const CORS_PROXY = "https://corsproxy.io/?";

function getApiUrl() {
  // Use CORS proxy if running from https (GitHub Pages)
  if (typeof window !== 'undefined' && window.location.protocol === 'https:' && window.location.hostname.includes('github')) {
    return CORS_PROXY + encodeURIComponent(API_URL);
  }
  return API_URL;
}

const BATCHES = [
  {batch_id:"BAT-001", sku_id:"SKU02", sku_name:"Full Cream Milk 1L", store_id:"ST01", store_name:"Store A - Koramangala", manufactured_date:"2026-07-16", expiry_date:"2026-07-23", hours_to_expiry:44, on_hand_qty:120, quality_status:"ok", previously_transferred:false, returned_from_customer:false},
  {batch_id:"BAT-002", sku_id:"SKU01", sku_name:"Toned Milk 500ml", store_id:"ST01", store_name:"Store A - Koramangala", manufactured_date:"2026-07-16", expiry_date:"2026-07-23", hours_to_expiry:40, on_hand_qty:150, quality_status:"ok", previously_transferred:false, returned_from_customer:false},
  {batch_id:"BAT-003", sku_id:"SKU03", sku_name:"Toned Milk 1L", store_id:"ST01", store_name:"Store A - Koramangala", manufactured_date:"2026-07-16", expiry_date:"2026-07-23", hours_to_expiry:46, on_hand_qty:200, quality_status:"ok", previously_transferred:false, returned_from_customer:false},
  {batch_id:"BAT-004", sku_id:"SKU04", sku_name:"Skimmed Milk 500ml", store_id:"ST02", store_name:"Store B - HSR Layout", manufactured_date:"2026-07-16", expiry_date:"2026-07-23", hours_to_expiry:47, on_hand_qty:90, quality_status:"ok", previously_transferred:false, returned_from_customer:false},
  {batch_id:"BAT-005", sku_id:"SKU05", sku_name:"Flavored Milk 200ml", store_id:"ST03", store_name:"Store C - BTM Layout", manufactured_date:"2026-07-15", expiry_date:"2026-07-22", hours_to_expiry:30, on_hand_qty:60, quality_status:"temperature_breached", previously_transferred:false, returned_from_customer:true},
  {batch_id:"BAT-006", sku_id:"SKU04", sku_name:"Skimmed Milk 500ml", store_id:"ST01", store_name:"Store A - Koramangala", manufactured_date:"2026-07-13", expiry_date:"2026-07-25", hours_to_expiry:96, on_hand_qty:80, quality_status:"ok", previously_transferred:false, returned_from_customer:false},
];

const EVAL_CASES = [
  {case_id:"EVAL-01", case_name:"Happy Path", batch_id:"BAT-001", description:"Near-expiry Full Cream Milk at Store A. Clear excess inventory vs demand, strong demand at nearby Store B."},
  {case_id:"EVAL-02", case_name:"Rank by Demand", batch_id:"BAT-002", description:"Two nearby destinations: one closer but low demand, one farther with high demand."},
  {case_id:"EVAL-03", case_name:"Hero Store Fallback", batch_id:"BAT-003", description:"No nearby stores can absorb excess. Same-city hero store beyond 10km has strong demand."},
  {case_id:"EVAL-04", case_name:"Low Confidence", batch_id:"BAT-004", description:"Demand forecast is unreliable. Agent must escalate, not guess."},
  {case_id:"EVAL-05", case_name:"Quality Gate", batch_id:"BAT-005", description:"Temperature breach detected. Agent refuses transfer regardless of demand."},
  {case_id:"EVAL-06", case_name:"Track Record Check", batch_id:"BAT-006", description:"High-confidence label contradicted by recent forecast errors."}
];

function saveKey() {
  const input = document.getElementById("api-key");
  if (input.value.trim()) {
    localStorage.setItem("anthropic_api_key", input.value);
    input.value = "";
    alert("API key saved!");
  }
}

function renderCaseSelector() {
  const selector = document.getElementById("case-selector");
  selector.innerHTML = "";
  EVAL_CASES.forEach(ec => {
    const btn = document.createElement("button");
    btn.className = "case-btn";
    btn.textContent = ec.case_name;
    btn.onclick = () => runCase(ec.batch_id);
    selector.appendChild(btn);
  });
}

async function runCase(batchId) {
  const batch = BATCHES.find(b => b.batch_id === batchId);
  if (!batch) return;

  const workflowEl = document.getElementById("workflow");
  workflowEl.innerHTML = "";
  workflowEl.classList.add("active");

  // Stage 1: INPUT
  renderStage1(workflowEl, batch);

  // Stage 2: CONTEXT
  await new Promise(r => setTimeout(r, 1500));
  renderStage2(workflowEl, batch);

  // Stage 3: DECISION
  await new Promise(r => setTimeout(r, 1500));
  renderStage3Loading(workflowEl);

  const apiKey = localStorage.getItem("anthropic_api_key");
  if (!apiKey) {
    workflowEl.innerHTML += "<div style='color:var(--danger);'>No API key saved. Please add your key above.</div>";
    return;
  }

  try {
    const apiUrl = getApiUrl();
    const response = await fetch(apiUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 2048,
        messages: [{
          role: "user",
          content: `Analyze this batch:\n\nBatch: ${batch.batch_id}\nSKU: ${batch.sku_name}\nStore: ${batch.store_name}\nHours to expiry: ${batch.hours_to_expiry}\nOn hand: ${batch.on_hand_qty} units\n\nRespond with your analysis of whether this should be transferred, who to, why, and what risks exist.`
        }]
      })
    });

    if (!response.ok) {
      throw new Error(`API error: ${response.status}`);
    }

    const data = await response.json();
    const analysis = data.content[0].text;

    renderStage3Result(workflowEl, batch, analysis);
    renderStage4Action(workflowEl, batch, analysis);
  } catch (err) {
    workflowEl.innerHTML += `<div style='color:var(--danger);'>Error: ${err.message}</div>`;
  }
}

function renderStage1(container, batch) {
  const html = `
    <div class="stage-block">
      <div class="stage-header">
        <div class="stage-number">1</div>
        <div>
          <div class="stage-title">Detect Near-Expiry Stock</div>
          <div class="stage-description">Scanning inventory for items approaching expiration</div>
        </div>
      </div>
      <div class="stage-content">
        <div class="card">
          <div class="card-label">Batch ID</div>
          <div class="card-value">${batch.batch_id}</div>
        </div>
        <div class="card">
          <div class="card-label">Product</div>
          <div class="card-value">${batch.sku_name}</div>
          <div class="card-subtext">at ${batch.store_name}</div>
        </div>
        <div class="card">
          <div class="card-label">Time to Expiry</div>
          <div class="card-value">${batch.hours_to_expiry}h</div>
          <div class="card-subtext">Expiring: ${batch.expiry_date}</div>
        </div>
        <div class="card">
          <div class="card-label">Quantity at Risk</div>
          <div class="card-value">${batch.on_hand_qty} units</div>
          <div class="card-subtext">Currently on hand</div>
        </div>
        <p class="explanation-text">
          This batch is within the 48-hour review window. We're analyzing whether it should be transferred to avoid waste.
        </p>
      </div>
    </div>
  `;
  container.innerHTML += html;
}

function renderStage2(container, batch) {
  const html = `
    <div class="stage-block">
      <div class="stage-header">
        <div class="stage-number">2</div>
        <div>
          <div class="stage-title">Gather Context</div>
          <div class="stage-description">Checking demand forecasts, store locations, quality flags</div>
        </div>
      </div>
      <div class="stage-content">
        <div class="card">
          <div class="card-label">Quality Status</div>
          <div class="card-value">${batch.quality_status === "ok" ? "✓ Clear" : "⚠ Issues Detected"}</div>
          <div class="card-subtext">${batch.quality_status === "ok" ? "No quality concerns" : "This batch has quality concerns that may block transfer"}</div>
        </div>
        <div class="card">
          <div class="card-label">Transfer History</div>
          <div class="card-value">${batch.previously_transferred ? "Previously transferred" : "First time in stores"}</div>
        </div>
        <p class="explanation-text">
          The agent is cross-referencing quality flags, demand forecasts across nearby stores, and historical transfer outcomes to understand the full context.
        </p>
      </div>
    </div>
  `;
  container.innerHTML += html;
}

function renderStage3Loading(container) {
  const html = `
    <div class="stage-block">
      <div class="stage-header">
        <div class="stage-number">3</div>
        <div>
          <div class="stage-title">Agent Decision</div>
          <div class="stage-description">Claude is analyzing policy and making a recommendation</div>
        </div>
      </div>
      <div class="stage-content">
        <p class="loading">
          <div class="spinner"></div>
          Analyzing demand patterns, shelf-life windows, and transfer feasibility...
        </p>
      </div>
    </div>
  `;
  container.innerHTML += html;
}

function renderStage3Result(container, batch, analysis) {
  const isRecommend = !analysis.toLowerCase().includes("refuse") && !analysis.toLowerCase().includes("escalate");

  const html = `
    <div class="stage-block">
      <div class="stage-header">
        <div class="stage-number">3</div>
        <div>
          <div class="stage-title">Agent Recommendation</div>
          <div class="stage-description">Decision and reasoning</div>
        </div>
      </div>
      <div class="stage-content">
        <div class="status-badge ${isRecommend ? "ok" : "danger"}">
          ${isRecommend ? "✓ Transfer Recommended" : "⚠ Cannot Transfer"}
        </div>
        <div class="decision-box">
          <strong>Agent's Analysis:</strong><br>
          ${analysis.substring(0, 500)}...
        </div>
      </div>
    </div>
  `;

  // Replace the loading block
  const blocks = container.querySelectorAll(".stage-block");
  if (blocks.length > 2) {
    blocks[2].remove();
  }
  container.innerHTML += html;
}

function renderStage4Action(container, batch) {
  const html = `
    <div class="stage-block">
      <div class="stage-header">
        <div class="stage-number">4</div>
        <div>
          <div class="stage-title">Manager Approval Gate</div>
          <div class="stage-description">Human review and decision</div>
        </div>
      </div>
      <div class="stage-content">
        <p class="explanation-text">
          <strong>Nothing moves without you.</strong> The agent has made its recommendation above. You decide whether to approve the transfer or escalate for further review. If approved, a pending transfer order will be created for warehouse staff to execute.
        </p>
        <div class="action-buttons">
          <button class="btn-approve" onclick="alert('Transfer approved! Pending order created.')">Approve Transfer</button>
          <button class="btn-escalate" onclick="alert('Escalated to management for manual review.')">Escalate</button>
        </div>
      </div>
    </div>
    <div class="footer-text">
      ✓ Humans make the final call. The agent proposes, you dispose.
    </div>
  `;
  container.innerHTML += html;
}

renderCaseSelector();
</script>

</body>
</html>
