const POLICY_FILES = [
  {filename:"transfer_rules.md", text: `# Near-Expiry Inventory Transfer Policy

Applies to: packaged fresh milk batches across Store A, Store B, Store C, and Store D (dark stores). V1 covers inter-store transfer only.

## Section 1 — Review Window
A batch enters review when all three are true:
1. 48 hours or less remain before expiry.
2. Predicted demand at the source store before expiry is lower than the batch's on-hand quantity.
3. The resulting projected unsold quantity is greater than zero.

## Section 2 — Destination Eligibility
A destination store is eligible if it is within 10 km of the source store, OR it is a designated same-city hero store considered when no store within 10 km can absorb the excess.

## Section 3 — Destination Ranking
Eligible destinations are ranked by projected SKU demand and ability to absorb the stock — never by distance alone. Before recommending a destination, the agent must check that store's own existing on-hand inventory of the same SKU. A destination that already holds substantial inventory of the SKU relative to its own demand must be ranked below a destination with genuine unmet need (lower existing inventory relative to demand). The nearest store is not automatically the recommended one, and neither is the store with the highest raw demand if it is already well-stocked on that SKU.

## Section 4 — Shelf-Life-After-Arrival Rule
A transfer must leave at least 24 hours of shelf life remaining after the batch arrives at the destination, accounting for transport time. If this cannot be met, the agent must not recommend the transfer.

## Section 5 — Transfer Quantity Cap
A single recommended transfer must not exceed 30% of the source store's available on-hand quantity for that SKU, even if a larger quantity is at risk of expiring.

## Section 6 — Forecast Confidence Requirement
A demand forecast is acceptable only if it is labeled medium or high confidence AND the same SKU/destination store's most recent forecast error on record in the recommendation outcome log is within ±20% of actual demand. When confidence is labeled low, or when it is labeled medium/high but the most recent recorded forecast error for that SKU/store exceeds ±20%, the agent must treat the forecast as unacceptable, flag it as unreliable, and escalate rather than recommend a transfer — even if the label alone looks fine. A confidence label must never be trusted at face value without checking it against the recommendation outcome log.

## Section 7 — Quality Gate
If a batch's quality status is damaged, temperature_breached, or quality_unclear, the agent must refuse to recommend any transfer and escalate for human inspection, regardless of demand or shelf life. A returned_from_customer flag alone does not automatically block a transfer — it must be surfaced for manager review.

## Section 8 — Scope Boundary
The agent may only recommend inter-store transfers. It must never recommend, design, or price a discount, promotion, or bundle, and must never select a customer segment for activation. If no transfer is feasible, the agent records expected wastage instead of proposing a promotional alternative.

## Section 9 — Human Approval Gate
The agent may only produce a recommendation. A warehouse manager must approve the destination store and transfer quantity before the agent creates a pending transfer order. Humans alone confirm physical dispatch and receipt — the agent cannot move stock.

## Section 10 — Escalation Triggers
Escalate instead of recommending a normal transfer when any of the following apply:
- No eligible destination exists within 10 km and no feasible same-city hero-store transfer exists.
- Demand forecast confidence is unacceptable per Section 6 (either labeled low, or labeled medium/high but contradicted by a recent forecast error exceeding ±20% in the recommendation outcome log).
- Required order or inventory data is missing or inconsistent.
- Quality status is damaged, temperature_breached, or unclear (see Section 7).
- Recommended quantity would exceed the 30% source-stock cap (see Section 5).
- Shelf life after arrival would fall below 24 hours (see Section 4).
- Every eligible destination already holds sufficient inventory of the SKU relative to its own demand, leaving no destination with genuine unmet need (see Section 3).

If a batch cannot be transferred and becomes waste, the agent must record the wastage reason, including whether the item was sold, returned, or quality-flagged, so downstream systems can learn whether the waste traces to a dependent process issue.
`}
];

const OUTPUT_FORMAT_BLOCK = OUTPUT_FIELDS.map(function(f) { return f.label + ": ..."; }).join("\n");

const SYSTEM_PROMPT = `ROLE:
You are the Near-Expiry Inventory Transfer Agent for quick-commerce dark stores. Your role is to help warehouse managers reduce packaged fresh milk wastage by detecting near-expiry stock, validating demand forecasts, recommending safe inter-store transfers, and asking for human approval before creating any transfer order. V1 is transfer-only.

CONTEXT:
Use only the embedded data provided to you: BATCHES, DEMAND_FORECAST, STORE_DISTANCES, QUALITY_FLAGS, TRANSFER_HISTORY, RECOMMENDATION_LOG, and the policy in policies/transfer_rules.md. Never invent facts, batches, stores, or numbers that are not present in this context.

RULES - you must not:
- Independently change prices or choose customer segments for activation.
- Recommend, design, approve, or launch discounts, combo deals, pricing changes, or promotional campaigns. If no transfer is feasible, escalate or record expected wastage instead of suggesting a promotion.
- Recommend a transfer unless at least 24 hours of shelf life is expected to remain after arrival.
- Independently move stock, complete a physical transfer, approve questionable quality, or override escalation rules.
- Create a transfer order without the warehouse manager first approving the destination store and transfer quantity. Only humans perform and confirm physical dispatch and receipt.
- Recommend a destination store without checking that destination's existing on-hand inventory of the same SKU (given in each destination candidate's existing_inventory_units_of_same_sku field). A destination that already holds substantial inventory of the SKU relative to its own demand must not be recommended over a destination with genuine unmet need (lower existing inventory relative to demand), even if its raw demand number is higher.
- Trust a forecast_confidence label at face value. A forecast is acceptable only if it is labeled medium or high AND the same SKU/destination store's most recent forecast error in recent_recommendation_history is within +/-20% of actual demand. If the label says medium or high but the most recent recorded error for that SKU/store exceeds +/-20%, treat confidence as unacceptable and escalate, even though the label alone looks fine.

OUTPUT:
Respond using exactly this line format, one field per line, in this exact order, with no extra commentary before or after and no blank lines between fields:
${OUTPUT_FORMAT_BLOCK}

The Status field must be exactly "OK" or "REFUSED-ESCALATE - <short reason citing the rule or policy section>". Use REFUSED-ESCALATE whenever any RULE above or ESCALATION trigger below applies (quality gate, low forecast confidence, missing or inconsistent data, no eligible destination, no destination with genuine unmet need, over-cap quantity, or insufficient shelf life after arrival). When Status is REFUSED-ESCALATE, still fill in every other field: use "N/A" for fields that do not apply (for example Recommended Destination Store or Recommended Transfer Quantity), but always state the real Units At Risk, Expiry Date, Manufactured Date, Previously Transferred, Returned From Customer Order, and Why from the actual data.

The Why line must name the exact data you used (batch ID, store IDs, forecast numbers, existing inventory figures) and the exact policy section you applied (for example "Section 4" or "Section 7").

ESCALATION:
Stop and escalate, stating the reason, when confidence is low, data is missing, the request is out of policy, or stakes are high - specifically:
- No eligible store within 10km and no feasible same-city hero-store transfer exists.
- Demand forecast confidence is unacceptable - either labeled low, or labeled medium/high but contradicted by a recent forecast error exceeding +/-20% for that SKU/store in recent_recommendation_history.
- Required order or inventory data is missing or inconsistent.
- Item quality status is damaged, temperature_breached, or unclear.
- Recommended transfer quantity would exceed 30% of the source store's available stock for that SKU.
- Shelf life after arrival would be less than 24 hours.
- Every eligible destination already holds sufficient inventory of the SKU relative to its own demand, leaving no destination with genuine unmet need.
`;

const API_KEY_STORAGE_KEY = "anthropic_api_key";

function updateKeyStatus() {
  const status = document.getElementById("key-status");
  status.textContent = localStorage.getItem(API_KEY_STORAGE_KEY) ? "Key saved" : "No key saved";
}

document.getElementById("save-key-btn").addEventListener("click", function() {
  const input = document.getElementById("api-key-input");
  const value = input.value.trim();
  if (value) {
    localStorage.setItem(API_KEY_STORAGE_KEY, value);
    input.value = "";
  }
  updateKeyStatus();
});

updateKeyStatus();

function getDestinationCandidates(batch) {
  const distances = STORE_DISTANCES.filter(function(d) {
    return d.store_a_id === batch.store_id || d.store_b_id === batch.store_id;
  });
  return distances.map(function(d) {
    const otherId = d.store_a_id === batch.store_id ? d.store_b_id : d.store_a_id;
    const otherName = d.store_a_id === batch.store_id ? d.store_b_name : d.store_a_name;
    const forecast = DEMAND_FORECAST.find(function(f) {
      return f.batch_id === batch.batch_id && f.store_id === otherId;
    });
    const existingInventory = BATCHES
      .filter(function(b) { return b.store_id === otherId && b.sku_id === batch.sku_id; })
      .reduce(function(sum, b) { return sum + b.on_hand_qty; }, 0);
    return {
      store_id: otherId,
      store_name: otherName,
      distance_km: d.distance_km,
      transport_time_min: d.transport_time_min,
      predicted_demand_units: forecast ? forecast.predicted_demand_units : null,
      forecast_confidence: forecast ? forecast.forecast_confidence : null,
      existing_inventory_units_of_same_sku: existingInventory
    };
  });
}

function buildCaseContext(batch) {
  const forecasts = DEMAND_FORECAST.filter(function(f) { return f.batch_id === batch.batch_id; });
  const flags = QUALITY_FLAGS.filter(function(q) { return q.batch_id === batch.batch_id; });
  const destinationCandidates = getDestinationCandidates(batch);
  const recentRecommendationHistory = RECOMMENDATION_LOG.filter(function(r) { return r.sku_id === batch.sku_id; });
  return {
    batch: batch,
    linked_demand_forecast: forecasts,
    destination_candidates: destinationCandidates,
    linked_quality_flags: flags,
    recent_recommendation_history: recentRecommendationHistory
  };
}

function parseAgentOutput(text) {
  const fields = {};
  let allFound = true;
  OUTPUT_FIELDS.forEach(function(f) {
    const escapedLabel = f.label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("^" + escapedLabel + ":\\s*(.*)$", "im");
    const match = text.match(re);
    if (match) {
      fields[f.key] = match[1].trim();
    } else {
      allFound = false;
    }
  });
  return { ok: allFound, fields: fields };
}

const RUN_LOG = [];

function appendRunLogEntry(batch, parsedFields, humanAction) {
  RUN_LOG.push({
    time: new Date().toLocaleString(),
    case: batch.batch_id + " (" + batch.sku_name + " @ " + batch.store_name + ")",
    agent_decision: parsedFields.status + " - " + parsedFields.risk_summary,
    human_action: humanAction
  });
  renderRunLog();
}

function renderRunLog() {
  const tbody = document.getElementById("run-log-body");
  tbody.innerHTML = "";
  RUN_LOG.forEach(function(entry) {
    const tr = document.createElement("tr");
    ["time", "case", "agent_decision", "human_action"].forEach(function(key) {
      const td = document.createElement("td");
      td.textContent = entry[key];
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function addReviewGate(container, batch, parsedFields) {
  const gateDiv = document.createElement("div");

  const approveBtn = document.createElement("button");
  approveBtn.type = "button";
  approveBtn.textContent = "Approve";

  const editBtn = document.createElement("button");
  editBtn.type = "button";
  editBtn.textContent = "Edit";

  const escalateBtn = document.createElement("button");
  escalateBtn.type = "button";
  escalateBtn.textContent = "Escalate";

  const statusText = document.createElement("span");

  gateDiv.appendChild(approveBtn);
  gateDiv.appendChild(editBtn);
  gateDiv.appendChild(escalateBtn);
  gateDiv.appendChild(statusText);
  container.appendChild(gateDiv);

  function lockGate(label) {
    approveBtn.disabled = true;
    editBtn.disabled = true;
    escalateBtn.disabled = true;
    statusText.textContent = label;
  }

  approveBtn.addEventListener("click", function() {
    appendRunLogEntry(batch, parsedFields, "Approved");
    lockGate("Approved.");
  });

  editBtn.addEventListener("click", function() {
    approveBtn.disabled = true;
    editBtn.disabled = true;
    escalateBtn.disabled = true;

    const editArea = document.createElement("textarea");
    editArea.rows = 8;
    editArea.cols = 60;
    editArea.value = OUTPUT_FIELDS.map(function(f) { return f.label + ": " + parsedFields[f.key]; }).join("\n");

    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.textContent = "Save";

    gateDiv.appendChild(editArea);
    gateDiv.appendChild(saveBtn);

    saveBtn.addEventListener("click", function() {
      const firstLine = editArea.value.split("\n")[0];
      appendRunLogEntry(batch, parsedFields, "Edited: " + firstLine);
      editArea.remove();
      saveBtn.remove();
      lockGate("Edited and saved.");
    });
  });

  escalateBtn.addEventListener("click", function() {
    approveBtn.disabled = true;
    editBtn.disabled = true;
    escalateBtn.disabled = true;

    const reasonInput = document.createElement("input");
    reasonInput.type = "text";
    reasonInput.placeholder = "One-line escalation reason";

    const confirmBtn = document.createElement("button");
    confirmBtn.type = "button";
    confirmBtn.textContent = "Confirm escalation";

    gateDiv.appendChild(reasonInput);
    gateDiv.appendChild(confirmBtn);

    confirmBtn.addEventListener("click", function() {
      const reason = reasonInput.value.trim() || "(no reason given)";
      appendRunLogEntry(batch, parsedFields, "Escalated: " + reason);
      reasonInput.remove();
      confirmBtn.remove();
      lockGate("Escalated.");
    });
  });
}

function renderParsedOutput(container, text, batch) {
  container.innerHTML = "";
  const parsed = parseAgentOutput(text);

  if (!parsed.ok) {
    const notice = document.createElement("p");
    notice.textContent = "agent output did not match format";
    container.appendChild(notice);
    const raw = document.createElement("pre");
    raw.textContent = text;
    container.appendChild(raw);
    return;
  }

  const statusP = document.createElement("p");
  const statusLabel = document.createElement("strong");
  statusLabel.textContent = "Status: ";
  statusP.appendChild(statusLabel);
  statusP.appendChild(document.createTextNode(parsed.fields.status));
  container.appendChild(statusP);

  const dl = document.createElement("dl");
  OUTPUT_FIELDS.forEach(function(f) {
    if (f.key === "why" || f.key === "status") return;
    const dt = document.createElement("dt");
    dt.textContent = f.label;
    const dd = document.createElement("dd");
    dd.textContent = parsed.fields[f.key];
    dl.appendChild(dt);
    dl.appendChild(dd);
  });
  container.appendChild(dl);

  const whyP = document.createElement("p");
  const whyLabel = document.createElement("strong");
  whyLabel.textContent = "Why: ";
  whyP.appendChild(whyLabel);
  whyP.appendChild(document.createTextNode(parsed.fields.why));
  container.appendChild(whyP);

  addReviewGate(container, batch, parsed.fields);
}

async function runCase(batch, outputEl) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE_KEY);
  if (!apiKey) {
    outputEl.textContent = "Error: no API key saved. Add your Anthropic API key in Settings above, then try again.";
    return;
  }

  outputEl.textContent = "Running...";

  const context = buildCaseContext(batch);
  const userMessage = "Case:\n" + JSON.stringify(context, null, 2) +
    "\n\nPolicy (policies/transfer_rules.md):\n" + POLICY_FILES[0].text;

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: userMessage }]
      })
    });

    if (!response.ok) {
      let errText;
      try {
        const errJson = await response.json();
        errText = (errJson.error && errJson.error.message) ? errJson.error.message : JSON.stringify(errJson);
      } catch (parseErr) {
        errText = await response.text();
      }
      if (response.status === 401) {
        outputEl.textContent = "Error: the API key was rejected (401 unauthorized). Check the key in Settings.";
      } else if (response.status === 429) {
        outputEl.textContent = "Error: rate limited or out of credit (429). " + errText;
      } else {
        outputEl.textContent = "Error (" + response.status + "): " + errText;
      }
      return;
    }

    const data = await response.json();
    const text = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : JSON.stringify(data);
    renderParsedOutput(outputEl, text, batch);
  } catch (err) {
    outputEl.textContent = "Error: could not reach the API. Check your internet connection. (" + err.message + ")";
  }
}

// Render: policy file names

const batchesDiv = document.getElementById("batches");
BATCHES.forEach(function(batch) {
  const wrapper = document.createElement("div");

  summary.innerHTML =
    "<li>Expiry: " + batch.expiry_date + " (" + batch.hours_to_expiry + "h remaining)</li>" +
    "<li>On hand: " + batch.on_hand_qty + " units</li>" +
    "<li>Quality status: " + batch.quality_status + "</li>" +
    "<li>Previously transferred: " + batch.previously_transferred + "</li>" +
    "<li>Returned from customer: " + batch.returned_from_customer + "</li>";
  wrapper.appendChild(summary);

  const forecasts = DEMAND_FORECAST.filter(function(f) { return f.batch_id === batch.batch_id; });
  const forecastHeading = document.createElement("p");
  forecastHeading.textContent = "Linked demand forecast:";
  wrapper.appendChild(forecastHeading);
  const forecastList = document.createElement("ul");
  forecasts.forEach(function(f) {
    const li = document.createElement("li");
    li.textContent = f.store_id + ": predicted " + f.predicted_demand_units + " units, pre-labeled expected " +
      f.pre_labeled_expected_demand_units + " units, confidence " + f.forecast_confidence + " (" + f.notes + ")";
    forecastList.appendChild(li);
  });
  wrapper.appendChild(forecastList);

  const distances = STORE_DISTANCES.filter(function(d) {
    return d.store_a_id === batch.store_id || d.store_b_id === batch.store_id;
  });
  const distanceHeading = document.createElement("p");
  distanceHeading.textContent = "Linked store distances from " + batch.store_id + ":";
  wrapper.appendChild(distanceHeading);
  const distanceList = document.createElement("ul");
  distances.forEach(function(d) {
    const otherName = d.store_a_id === batch.store_id ? d.store_b_name : d.store_a_name;
    const otherId = d.store_a_id === batch.store_id ? d.store_b_id : d.store_a_id;
    const li = document.createElement("li");
    li.textContent = otherId + " (" + otherName + "): " + d.distance_km + " km, " + d.transport_time_min + " min transport";
    distanceList.appendChild(li);
  });
  wrapper.appendChild(distanceList);

  const flags = QUALITY_FLAGS.filter(function(q) { return q.batch_id === batch.batch_id; });
  const flagHeading = document.createElement("p");
  flagHeading.textContent = "Linked quality flag:";
  wrapper.appendChild(flagHeading);
  const flagList = document.createElement("ul");
  if (flags.length === 0) {
    const li = document.createElement("li");
    li.textContent = "(none on file)";
    flagList.appendChild(li);
  } else {
    flags.forEach(function(q) {
      const li = document.createElement("li");
      li.textContent = q.quality_status + " — " + q.flag_reason + " (flagged by " + q.flagged_by + " at " + q.flagged_at + ")";
      flagList.appendChild(li);
    });
  }
  wrapper.appendChild(flagList);

  const runBtn = document.createElement("button");
  runBtn.type = "button";
  runBtn.textContent = "Run";
  wrapper.appendChild(runBtn);

  const outputDiv = document.createElement("div");
  outputDiv.textContent = "(not run yet)";
  wrapper.appendChild(outputDiv);

  runBtn.addEventListener("click", function() {
    runCase(batch, outputDiv);
  });

  wrapper.appendChild(document.createElement("hr"));
  batchesDiv.appendChild(wrapper);
});
